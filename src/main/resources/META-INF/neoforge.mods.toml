[[mods]]
modId="matesignal"
version="${mod_version}"
displayName="MateSignal"
logoFile="pack.png"
description='''This enables cross-interaction between MateEngine and Minecraft. When activated, it shows cute messages during key moments: when day or night begins, when a dangerous mob is nearby, when your health or hunger is low, when you craft something, die, the weather changes, or you go to sleep.'''
authors="Shiny"

